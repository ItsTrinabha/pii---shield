[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloak"
version = "1.0.0"
description = "Local, fail-closed PII sanitisation gateway for documents and LLM workflows"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["pii", "privacy", "redaction", "ocr", "presidio", "spacy", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Text Processing",
]
dependencies = [
  "pymupdf>=1.24",
  "python-pptx>=1.0",
  "python-docx>=1.1",
  "pytesseract>=0.3.10",
  "opencv-python-headless>=4.9",
  "pillow>=10",
  "numpy>=1.26",
  "pydantic>=2.6",
  "presidio-analyzer>=2.2",
  "spacy>=3.7",
  "rapidfuzz>=3.6",
  "defusedxml>=0.7",
  "lxml>=5",
  "faker>=24",
  "wordfreq>=3.1",
  "tldextract>=5",
  "starlette>=0.40",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "rapidocr-onnxruntime>=1.2,<1.3",  # ocr.py caps its ONNX threads via this version's utils module
]

[project.optional-dependencies]
dev = ["build", "pytest>=8", "pytest-timeout", "ruff", "mypy", "reportlab", "pip-audit", "httpx", "streamlit>=1.35"]
legacy-ui = ["streamlit>=1.35"]  # the old Streamlit demo (src/pii_shield/app/main.py)
deep = ["gliner>=0.2"]  # --deep: GLiNER name model (slow on CPU); weights via scripts/fetch_models.py

[project.scripts]
cloak = "pii_shield.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pii_shield = ["config/*.json", "app/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
timeout = 600
markers = ["slow: runs OCR on the real sample files"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
