[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pii-shield"
version = "1.0.0"
description = "Fail-closed PII detection and sanitisation gateway between business documents and LLMs"
requires-python = ">=3.10"
dependencies = [
  "pymupdf>=1.24",
  "python-pptx>=1.0",
  "python-docx>=1.1",
  "pytesseract>=0.3.10",
  "opencv-python-headless>=4.9",
  "pillow>=10",
  "numpy>=1.26",
  "pydantic>=2.6",
  "presidio-analyzer>=2.2",
  "spacy>=3.7",
  "rapidfuzz>=3.6",
  "defusedxml>=0.7",
  "lxml>=5",
  "faker>=24",
  "wordfreq>=3.1",
  "tldextract>=5",
  "streamlit>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout", "ruff", "mypy", "reportlab", "pip-audit"]

[project.scripts]
pii-shield = "pii_shield.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pii_shield = ["config/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
timeout = 600
markers = ["slow: runs OCR on the real sample files"]

[tool.ruff]
line-length = 110
target-version = "py310"
