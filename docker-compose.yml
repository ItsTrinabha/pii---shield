services:
  cloak:
    build:
      context: .
      args:
        INSTALL_LIBREOFFICE: "true"    # also OCRs EMF/WMF drawings in DOCX/PPTX (+~500 MB image); "false" to skip
        INSTALL_DEEP: "true"           # GLiNER deep mode, CPU torch + weights baked in (+~1 GB image); "false" to skip
    image: cloak:latest
    container_name: cloak
    ports:
      - "127.0.0.1:8765:8765"          # reachable from this machine only
    environment:
      # Optional: set a fixed secret so audit fingerprints remain stable across restarts.
      - CLOAK_KEY=${CLOAK_KEY:-}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
